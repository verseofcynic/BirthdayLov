<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Birthday Invitation</title>
    <meta name="description" content="A digital birthday invitation." />
    <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- Loading / error boot screens -->
    <div id="boot-loader" class="boot">
      <div class="boot__spinner" aria-hidden="true"></div>
      <p class="boot__text">Loading your invitation…</p>
    </div>

    <div id="boot-error" class="boot boot--error" hidden>
      <h1 class="boot__title">We couldn't load this invitation</h1>
      <p class="boot__text" id="boot-error-message">Something went wrong.</p>
      <p class="boot__hint">
        Tip: this page needs to be opened through a local server (see README), not by
        double-clicking the file.
      </p>
    </div>

    <!-- Decorations layer (purely decorative, never clickable) -->
    <div id="decorations" class="decorations" aria-hidden="true" hidden></div>

    <!-- Header / nav -->
    <header id="site-header" class="header" hidden>
      <a class="header__brand" href="#hero" data-brand></a>
      <button
        id="nav-toggle"
        class="header__burger"
        aria-label="Open menu"
        aria-expanded="false"
        aria-controls="site-nav"
      >
        <span></span><span></span><span></span>
      </button>
      <nav id="site-nav" class="nav" aria-label="Main"></nav>
      <button id="music-toggle" class="music-btn" aria-label="Play background music" hidden>
        <span class="music-btn__icon" aria-hidden="true">♪</span>
      </button>
    </header>

    <main id="app" hidden>
      <section id="hero" class="section hero" hidden>
        <div class="hero__bg" id="hero-bg"></div>
        <div class="hero__inner reveal">
          <p class="hero__eyebrow" data-hero-eyebrow hidden></p>
          <h1 class="hero__title" data-hero-title></h1>
          <p class="hero__age" data-hero-age hidden></p>
          <p class="hero__subtitle" data-hero-subtitle hidden></p>
          <a class="btn btn--primary" data-hero-button hidden></a>
        </div>
        <div class="hero__scroll" aria-hidden="true">↓</div>
      </section>

      <section id="invitation" class="section section--pad invitation" hidden>
        <div class="wrap reveal">
          <h2 class="section__title" data-invitation-title></h2>
          <p class="invitation__message" data-invitation-message></p>
          <p class="invitation__signature" data-invitation-signature hidden></p>
        </div>
      </section>

      <section id="celebrant" class="section section--pad" hidden>
        <div class="wrap profile reveal">
          <figure class="profile__photo" hidden data-profile-figure>
            <img alt="" data-profile-img />
          </figure>
          <div class="profile__body">
            <h2 class="section__title" data-profile-title></h2>
            <p class="profile__tagline" data-profile-tagline hidden></p>
            <ul class="facts" data-profile-facts hidden></ul>
          </div>
        </div>
      </section>

      <section id="countdown" class="section section--pad countdown" hidden>
        <div class="wrap reveal">
          <h2 class="section__title" data-countdown-title></h2>
          <div class="countdown__grid" data-countdown-grid></div>
          <p class="countdown__message" data-countdown-message hidden></p>
        </div>
      </section>

      <section id="event" class="section section--pad" hidden>
        <div class="wrap reveal">
          <h2 class="section__title" data-event-title></h2>
          <div class="event__grid" data-event-grid></div>
          <a class="btn btn--ghost" data-event-map hidden target="_blank" rel="noopener">Open in Maps</a>
        </div>
      </section>

      <section id="memories" class="section section--pad" hidden>
        <div class="wrap reveal">
          <h2 class="section__title" data-memories-title></h2>
          <ol class="timeline" data-memories-list></ol>
        </div>
      </section>

      <section id="gallery" class="section section--pad" hidden>
        <div class="wrap reveal">
          <h2 class="section__title" data-gallery-title></h2>
          <div class="gallery__grid" data-gallery-grid></div>
        </div>
      </section>

      <section id="rsvp" class="section section--pad rsvp" hidden>
        <div class="wrap reveal">
          <h2 class="section__title" data-rsvp-title></h2>
          <p class="rsvp__note" data-rsvp-note hidden></p>
          <div class="rsvp__actions" data-rsvp-actions></div>
          <p class="rsvp__deadline" data-rsvp-deadline hidden></p>
        </div>
      </section>

      <section id="candles" class="section section--pad candles" hidden>
        <div class="wrap reveal">
          <h2 class="section__title" data-candles-title></h2>
          <p class="candles__hint" data-candles-hint hidden></p>
          <button class="cake" id="cake-btn" aria-label="Blow out the candles">
            <span class="cake__flames" aria-hidden="true">
              <i></i><i></i><i></i>
            </span>
            <span class="cake__body" aria-hidden="true"></span>
          </button>
        </div>
      </section>
    </main>

    <footer id="site-footer" class="footer" hidden>
      <div class="wrap">
        <p class="footer__message" data-footer-message hidden></p>
        <p class="footer__hashtag" data-footer-hashtag hidden></p>
        <ul class="socials" data-socials hidden></ul>
      </div>
    </footer>

    <!-- Lightbox -->
    <div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer" hidden>
      <button class="lightbox__close" id="lb-close" aria-label="Close photo viewer">×</button>
      <button class="lightbox__nav lightbox__nav--prev" id="lb-prev" aria-label="Previous photo">‹</button>
      <figure class="lightbox__figure">
        <img id="lb-img" alt="" />
        <figcaption id="lb-caption"></figcaption>
      </figure>
      <button class="lightbox__nav lightbox__nav--next" id="lb-next" aria-label="Next photo">›</button>
    </div>

    <div id="confetti-layer" class="confetti-layer" aria-hidden="true"></div>

    <audio id="bg-audio" loop preload="none"></audio>

    <script src="js/script.js" defer></script>
  </body>
</html>
